[build-system]
requires = ["setuptools<66", "setuptools_scm[toml]>=3.5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rmi.gencost"
description = "A tool for estimating generator unit costs from public utility data."
license = {file = "LICENSE.txt"}
readme = "README.rst"
dynamic = ["version"]
classifiers = [
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
]
requires-python = ">=3.10,<3.12"
dependencies = [
    "bottleneck >= 1.3,< 1.3.7",
    "numba >= 0.55.1,<0.57",
    "numexpr >= 2.8, < 2.8.5",
    "numpy >= 1.18.5,<2",
    "pandas >= 1.4,< 1.6",
    "pandera >= 0.12, <0.14",
    "platformdirs >=2.6,<3.2",
    "pyarrow>=7, <12",
    "rmi.etoolbox @ git+https://github.com/rmi/etoolbox.git",
]

[project.optional-dependencies]
pudl = [
    "fiona>=1.8.19,!=1.9.2", # a geopandas dependency that is a bit wonky
    "catalystcoop.pudl @ git+https://github.com/catalyst-cooperative/pudl.git",
]
dev = [
    "black[jupyter] >= 22,< 24",
    "isort>=5.0,<5.13",
    "ruff>0.0.215,<0.0.259",
    "tox>=3.20,<4.5",
]
doc = [
    "doc8>=0.9,<1.2",  # Ensures clean documentation formatting
    "furo>=2022.4.7",  # A clean customisable Sphinx documentation theme.
    "rstcheck[sphinx,toml]>=5.0,<6.2",  # ReStructuredText linter
    "sphinx>=4,!=5.1.0,<6.1.4",
    "sphinx-autoapi>=1.8,<2.1",
    "sphinx-issues>=1.2,<3.1",
    "sphinx-autodoc-typehints>1.19,<1.23.0",
    "sphinxcontrib-mermaid>0.7,<0.9.0",
]
tests = [
    "coverage>=5.3,<7.3",  # Lets us track what code is being tested
    "pre-commit>=2.9,<3.3",  # Allow us to run pre-commit hooks in testing
    "pytest>=6.2,<7.3",  # test framework
    "pytest-console-scripts>=1.1,<1.4",  # Allow automatic testing of scripts
    "pytest-cov>=2.10,<4.1",  # Pytest plugin for working with coverage
    "ruff>0.0.215,<0.0.259",
    "tox>=3.20,<4.5",  # Python test environment manager
]

[project.scripts]  # entry points
winston = "gencost.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "gencost._version.__version__"}

[tool.setuptools_scm]
write_to = "src/gencost/_version.py"

#######################################################################################
# Configurations for linters and other tools
#######################################################################################
[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = "\\.pyi?$"

[tool.doc8]
max-line-length = 88
ignore-path = "docs/_build"

[tool.isort]
profile = "black"
known_first_party = ["gencost"]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = ["--verbose"]
log_format = "%(asctime)s [%(levelname)8s] %(name)s:%(lineno)s %(message)s"
log_date_format=" %Y-%m-%d %H:%M:%S"
log_cli = true
log_cli_level = "INFO"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL", "ELLIPSIS"]
filterwarnings = [
    "ignore:distutils Version classes are deprecated:DeprecationWarning",
    "ignore:Creating a LegacyVersion:DeprecationWarning:pkg_resources[.*]",
]

[tool.rstcheck]
report_level = "WARNING"
ignore_roles = ["pr", "issue", "user", "include"]
ignore_messages = '(Hyperlink target .* is not referenced\.$|Duplicate implicit target name:|An `AttributeError` error occured.*)'
ignore_directives = ["bibliography", "todo", "include"]

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["A", "B", "C", "E", "F", "N", "S", "SIM", "TCH", "W"]
ignore = []
# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F",]
unfixable = []
# By default, always enumerate fixed violations.
show-fixes = true
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
# Same as Black.
line-length = 88
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Assume Python 3.10.
target-version = "py310"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"docs/conf.py" = ["E501"]
"tests/*.py" = ["S101"]

[tool.ruff.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 15
